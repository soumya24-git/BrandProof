databases:
  - name: brandproof-db
    databaseName: brandproof
    user: brandproof
    plan: 0.5c-1g
    region: singapore

services:
  - type: web
    name: brandproof-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn brandproof.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/brand/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: brandproof-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MEDIA_ROOT
        value: /var/data/media
    disk:
      name: brandproof-uploads
      mountPath: /var/data
      sizeGB: 1
